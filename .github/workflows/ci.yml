name: Build and verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build backend/API/API.csproj -c Release
      - name: Start PostgreSQL and apply migrations
        run: |
          python - <<'PYCODE'
          import secrets
          from pathlib import Path
          Path('.env').write_text('POSTGRES_DB=diwali_test\nPOSTGRES_USER=diwali\nPOSTGRES_PASSWORD='+secrets.token_hex(24)+'\nSeedAdmin__Username=admin\nSeedAdmin__Password='+secrets.token_hex(24)+'\n')
          PYCODE
          docker compose up -d db
          docker compose build api
          docker compose run --rm api --migrate --seed-admin
          docker compose up -d api
      - name: Integration acceptance tests
        run: |
          set -a
          . ./.env
          set +a
          python tests/acceptance.py
      - if: always()
        run: docker compose down -v
